<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Bounce Ball</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Menu Screen -->
    <div id="menu" class="screen active">
        <div class="menu-content">
            <h1 class="game-title">BOUNCE BALL</h1>
            <p class="tagline">Keep the ball bouncing!</p>
            <button id="startBtn" class="btn-primary">START GAME</button>
            <div class="high-score-display">
                <span class="label">BEST SCORE:</span>
                <span id="menuHighScore">0</span>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game" class="screen">
        <div class="game-header">
            <div class="score-container">
                <span class="label">SCORE</span>
                <span id="score" class="score-value">0</span>
            </div>
            <div class="level-container">
                <span class="label">LEVEL</span>
                <span id="level" class="level-value">1</span>
            </div>
            <div class="lives-container">
                <span class="label">LIVES</span>
                <span id="lives" class="lives-value">3</span>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="game-footer">
            <div class="instruction">Move paddle with mouse/touch</div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOver" class="screen">
        <div class="game-over-content">
            <h2 class="game-over-title">GAME OVER</h2>
            <div class="final-score">
                <span class="label">FINAL SCORE</span>
                <span id="finalScore" class="big-score">0</span>
            </div>
            <div id="newRecord" class="new-record hidden">
                🏆 NEW RECORD! 🏆
            </div>
            <div class="button-group">
                <button id="restartBtn" class="btn-primary">PLAY AGAIN</button>
                <button id="menuBtn" class="btn-secondary">MENU</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
