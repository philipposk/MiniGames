  <!-- crown stripe -->
  <rect x="86" y="110" width="84" height="10" fill="#ff9b3d"/>
  <!-- eyes -->
  <rect x="98" y="138" width="14" height="14" fill="#1b1f2a"/>
  <rect x="144" y="138" width="14" height="14" fill="#1b1f2a"/>
  <!-- beak -->
