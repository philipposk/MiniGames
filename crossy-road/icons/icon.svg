<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="40" fill="#1b1f2a"/>
  <!-- shadow -->
  <ellipse cx="128" cy="210" rx="60" ry="10" fill="rgba(0,0,0,0.35)"/>
  <!-- cube body (chicken) -->
  <!-- front face -->
  <rect x="74" y="100" width="108" height="100" fill="#cf9d2a"/>
  <!-- right face -->
