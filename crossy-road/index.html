<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Crossy Hop</title>
  <meta name="description" content="Crossy Hop: Cross the roads, rivers and rails.">
  <meta name="theme-color" content="#2f9e44">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js"></script>
  <script src="../shared/i18n.js"></script>
</head>
<body>
  <canvas id="c" aria-label="Game"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="dist"><span id="score" data-no-i18n>0</span></div>
    <div class="right">
      <div class="coins"><span class="coin-dot" aria-hidden="true"></span><span id="coins" data-no-i18n>0</span></div>
      <button class="icon" id="pauseBtn" aria-label="Pause">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div class="hint" id="hint" hidden><span>Tap to hop forward, swipe to turn</span><span>Keep moving: the screen does not wait</span></div>

  <section class="card" id="start">
    <a class="back" href="../" id="back1">‹ Games</a>
    <h1>Crossy Hop</h1>
    <p class="sub">Cross the roads, rivers and rails.</p>
    <div class="demo" aria-hidden="true"><div class="how"><span class="k">↑</span><span>Tap to hop forward</span></div><div class="how"><span class="k">↔</span><span>Swipe to hop sideways or back</span></div><div class="how"><span class="k">≈</span><span>Ride the logs. Water is deadly.</span></div></div>
    <p class="best" id="bestLine" hidden>Best <b id="best" data-no-i18n>0</b></p>
    <button class="go" id="playBtn">Play</button>
    <button class="mute" id="muteBtn" aria-label="Sound">Sound on</button>
  </section>

  <section class="card" id="paused" hidden>
    <h2>Paused</h2>
    <button class="go" id="resumeBtn">Resume</button>
    <button class="ghost" id="quitBtn">Menu</button>
  </section>

  <section class="card" id="over" hidden>
    <h2>Game over</h2>
    <p class="sub" id="overWhy"></p>
    <p class="newbest" id="newBest" hidden>New best!</p>
    <div class="stats"><div><small>Score</small><b id="oScore" data-no-i18n>0</b></div><div><small>Coins</small><b id="oCoins" data-no-i18n>0</b></div><div><small>Best</small><b id="oBest" data-no-i18n>0</b></div></div>
    <button class="go" id="againBtn">Play again</button>
    <a class="ghost" href="../" id="back2">Back to games</a>
  </section>

  <script src="game.js?v=5"></script>
</body>
</html>
