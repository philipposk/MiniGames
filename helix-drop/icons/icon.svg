<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1064"/>
      <stop offset="100%" stop-color="#07081c"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#4ff0c5"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ff0c5"/>
      <stop offset="50%" stop-color="#ff5cf2"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <!-- background for maskable safe zone -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- stacked rings -->
  <g stroke="url(#ring)" stroke-width="22" fill="none" opacity="0.85">
    <ellipse cx="256" cy="200" rx="150" ry="38"/>
    <ellipse cx="256" cy="280" rx="150" ry="38"/>
    <ellipse cx="256" cy="360" rx="150" ry="38"/>
  </g>
  <!-- gaps on each ring -->
  <g stroke="#07081c" stroke-width="26" fill="none" stroke-linecap="butt">
    <path d="M 200 195 a 150 38 0 0 1 60 -5" />
    <path d="M 260 275 a 150 38 0 0 1 60 -5" />
    <path d="M 180 355 a 150 38 0 0 1 50 -5" />
  </g>
  <!-- ball on top -->
  <circle cx="256" cy="140" r="38" fill="url(#ball)" stroke="#ffffff" stroke-width="3"/>
  <circle cx="246" cy="128" r="10" fill="#ffffff" opacity="0.8"/>
</svg>
