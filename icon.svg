<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MiniGames Arcade">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe4"/>
      <stop offset="1" stop-color="#ece6d7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#paper)"/>
  <rect x="48" y="48" width="416" height="416" rx="72" fill="none" stroke="#15151a" stroke-width="6"/>
  <!-- Coral dot, like the brand mark -->
  <circle cx="120" cy="120" r="22" fill="#ff3b1a"/>
  <circle cx="120" cy="120" r="38" fill="none" stroke="#ff3b1a" stroke-width="3" opacity="0.35"/>
  <!-- Big italic M for MiniGames -->
  <text x="256" y="348" font-family="ui-serif, Georgia, 'Times New Roman', serif" font-size="320" font-weight="800" font-style="italic" text-anchor="middle" fill="#15151a" letter-spacing="-12">M</text>
  <!-- Bottom microcopy -->
  <text x="256" y="430" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="28" font-weight="600" text-anchor="middle" fill="#15151a" letter-spacing="6">ARCADE</text>
</svg>
