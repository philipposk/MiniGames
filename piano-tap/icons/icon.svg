<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#14142a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ffd1"/>
      <stop offset="1" stop-color="#ff00e6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- White keys -->
  <g transform="translate(64,96)">
    <rect x="0"   y="0" width="92" height="320" rx="10" fill="#fafaff"/>
    <rect x="96"  y="0" width="92" height="320" rx="10" fill="#fafaff"/>
    <rect x="192" y="0" width="92" height="320" rx="10" fill="#fafaff"/>
    <rect x="288" y="0" width="92" height="320" rx="10" fill="#fafaff"/>
    <!-- Black keys -->
    <rect x="64"  y="0" width="56" height="200" rx="6" fill="#0a0a14"/>
    <rect x="160" y="0" width="56" height="200" rx="6" fill="#0a0a14"/>
    <rect x="256" y="0" width="56" height="200" rx="6" fill="#0a0a14"/>
  </g>
  <!-- Hit-line glow -->
  <rect x="48" y="408" width="416" height="6" rx="3" fill="url(#neon)"/>
</svg>
