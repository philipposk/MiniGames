<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Stick Runner">
  <rect width="512" height="512" rx="96" fill="#0f0f1e"/>
  <!-- ground line -->
  <line x1="64" y1="400" x2="448" y2="400" stroke="#7fdfa5" stroke-width="6" stroke-linecap="round"/>
  <!-- running stick figure -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- head -->
    <circle cx="256" cy="200" r="38" stroke-width="12"/>
    <!-- body -->
    <line x1="256" y1="238" x2="256" y2="320"/>
    <!-- arms (running pose) -->
    <line x1="256" y1="260" x2="210" y2="290"/>
    <line x1="256" y1="260" x2="310" y2="240"/>
    <!-- legs (mid stride) -->
    <line x1="256" y1="320" x2="220" y2="380"/>
    <line x1="256" y1="320" x2="300" y2="380"/>
  </g>
  <!-- speed lines -->
  <g stroke="#ffd700" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="100" y1="260" x2="170" y2="260"/>
    <line x1="120" y1="290" x2="180" y2="290"/>
    <line x1="100" y1="320" x2="170" y2="320"/>
  </g>
</svg>
