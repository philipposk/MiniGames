<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>The Rising - Level 5 Test (Triggers Ending)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
        }
        
        body {
            background: linear-gradient(to bottom, #1a1a2e 0%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            color: white;
        }
        
        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #gameCanvas {
            background: linear-gradient(to bottom, #2d4059 0%, #1a1a2e 100%);
            touch-action: none;
            display: block;
            width: 100vw;
            height: 100vh;
            max-width: 100%;
            max-height: 100%;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        
        #level {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 10px;
            color: #4ecca3;
        }
        
        #survivors {
            font-size: 18px;
            color: #4ecca3;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        #message.show {
            opacity: 1;
        }
        
        .instruction {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            padding: 0 20px;
            text-align: center;
        }
        
        .badge {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 107, 107, 0.9);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        @media (max-height: 600px) {
            #ui {
                top: 10px;
            }
            #level {
                font-size: 18px;
            }
            #survivors {
                font-size: 14px;
            }
            .instruction {
                bottom: 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div id="level">LEVEL 5</div>
            <div id="survivors">SURVIVORS: 70</div>
        </div>
        
        <div class="badge">⚠️ FINAL LEVEL - ENDING AFTER THIS!</div>
        
        <div id="message"></div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="instruction">TAP OR PRESS ENTER · FINAL LEVEL · REACH HEAVEN!</div>
    </div>
    
    <script src="ending.js"></script>
    <script src="game-level5.js"></script>
</body>
</html>
