<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rising - Minimal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        #gameCanvas {
            border: 2px solid #fff;
            background: #1a1a2e;
            display: block;
        }
        
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: lime;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="info">
        <div>Press ENTER or CLICK to place blocks</div>
        <div>Press R to restart</div>
    </div>
    <canvas id="gameCanvas" width="500" height="800"></canvas>
    <script src="game-minimal.js"></script>
</body>
</html>
